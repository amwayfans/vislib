ion", "category": "scroll", "name_zh": "螢光筆動畫", "name_en": "Highlighter animation", "meaning_zh": "重點文字的下半部被螢光筆塗上顏色", "ask_zh": "重點文字捲動進入畫面時，用螢光筆動畫由左到右塗上黃色底色，蓋住文字下半部，時間 0.8 秒。", "tags": ["highlighter", "marker", "text-highlight", "emphasis", "scroll-reveal", "copy", "underline"], "pack_zh": "Landing Page 與網站效果"}, {"id": "081", "pack": "lp", "no": "09", "slug": "hover-lift", "category": "hover-click", "name_zh": "Hover 浮起效果", "name_en": "Hover lift", "meaning_zh": "滑鼠移上去時，元素加深陰影並浮起", "ask_zh": "卡片加上 Hover 浮起效果：滑鼠移上去時往上浮 8 px，陰影加深，時間 0.3 秒。", "tags": ["hover", "lift", "float", "card", "shadow", "translatey", "interaction"], "pack_zh": "Landing Page 與網站效果"}, {"id": "082", "pack": "lp", "no": "10", "slug": "image-zoom-on-hover", "category": "hover-click", "name_zh": "Hover 圖片放大", "name_en": "Image zoom on hover", "meaning_zh": "外框不變，只有裡面的照片放大", "ask_zh": "作品照片加上 Hover 圖片放大，外框固定，裡面的圖在 0.5 秒內放大到 1.1 倍。", "tags": ["hover", "zoom", "image", "scale", "overflow-hidden", "thumbnail", "gallery"], "pack_zh": "Landing Page 與網站效果"}, {"id": "083", "pack": "lp", "no": "11", "slug": "cursor-follower", "category": "hover-click", "name_zh": "滑鼠跟隨效果", "name_en": "Cursor follower", "meaning_zh": "一個圓形延遲跟隨滑鼠游標移動", "ask_zh": "全站加上滑鼠跟隨效果，一個直徑 30 px 的橘紅色圓形，稍微延遲地跟著游標移動。", "tags": ["cursor", "custom-cursor", "cursor-follower", "mouse-follow", "lerp", "trail", "interaction"], "pack_zh": "Landing Page 與網站效果"}, {"id": "084", "pack": "lp", "no": "12", "slug": "magnetic-button", "category": "hover-click", "name_zh": "磁吸按鈕", "name_en": "Magnetic button", "meaning_zh": "游標靠近時，按鈕會被吸過去", "ask_zh": "把聯絡我們按鈕做成磁吸按鈕，往游標方向移動兩者距離的 0.3 倍，游標離開後要彈性地回到原位。", "tags": ["magnetic", "magnetic-button", "hover", "cursor", "elastic", "cta", "interaction"], "pack_zh": "Landing Page 與網站效果"}, {"id": "085", "pack": "lp", "no": "13", "slug": "ripple-effect", "category": "hover-click", "name_zh": "漣漪效果", "name_en": "Ripple effect", "meaning_zh": "從點擊的位置向外擴散出波紋", "ask_zh": "送出按鈕加上漣漪效果，從點擊位置擴散出白色圓形，0.6 秒內擴散並淡出。", "tags": ["ripple", "ink-ripple", "material", "click", "tap", "feedback", "button"], "pack_zh": "Landing Page 與網站效果"}, {"id": "086", "pack": "lp", "no": "14", "slug": "underline-animation", "category": "hover-click", "name_zh": "底線動畫", "name_en": "Underline animation", "meaning_zh": "滑鼠移到連結上時，底線從左邊延伸出來", "ask_zh": "選單連結加上底線動畫，滑鼠移上去時底線在 0.3 秒內從左邊延伸出來，移開時往右邊收掉。", "tags": ["underline", "hover", "link", "navigation", "menu", "text-link", "scalex"], "pack_zh": "Landing Page 與網站效果"}, {"id": "087", "pack": "lp", "no": "15", "slug": "before-after-slider", "category": "hover-click", "name_zh": "Before/After 對比滑桿", "name_en": "Before/after slider", "meaning_zh": "拖曳分隔線，比較前後的差異", "ask_zh": "把施工案例照片做成 Before/After 對比滑桿，拖曳中間的線，左邊顯示施工前、右邊顯示施工後，方便比較。", "tags": ["before-after", "image-comparison", "slider", "drag", "compare", "clip", "photo"], "pack_zh": "Landing Page 與網站效果"}, {"id": "088", "pack": "lp", "no": "16", "slug": "exit-intent-popup", "category": "hover-click", "name_zh": "Exit-intent 彈出視窗", "name_en": "Exit-intent popup", "meaning_zh": "訪客快離開頁面時跳出的慰留視窗", "ask_zh": "Landing Page 加上 Exit-intent 彈出視窗，游標移出畫面上緣時，跳出優惠券視窗，而且只出現一次。", "tags": ["exit-intent", "popup", "mouseleave", "coupon", "conversion", "retention", "lp"], "pack_zh": "Landing Page 與網站效果"}, {"id": "089", "pack": "lp", "no": "17", "slug": "preloader", "category": "loading-loops", "name_zh": "Loading 畫面", "name_en": "Preloader", "meaning_zh": "頁面載入期間顯示的畫面", "ask_zh": "幫網站做開場的 Loading 畫面，顯示 Logo 和百分比數字，到 100% 時畫面像布幕一樣往上拉開。", "tags": ["preloader", "loading-screen", "loader", "percentage", "intro", "splash", "curtain"], "pack_zh": "Landing Page 與網站效果"}, {"id": "090", "pack": "lp", "no": "18", "slug": "lazy-loading", "category": "loading-loops", "name_zh": "Lazy Loading", "name_en": "Lazy loading", "meaning_zh": "只載入進入畫面的圖片", "ask_zh": "相簿的圖片改用 Lazy Loading，載入前先顯示灰色佔位框，圖片載入後用 0.3 秒淡入。", "tags": ["lazy-loading", "lazy-load", "images", "placeholder", "performance", "spinner", "gallery"], "pack_zh": "Landing Page 與網站效果"}, {"id": "091", "pack": "lp", "no": "19", "slug": "infinite-scroll", "category": "loading-loops", "name_zh": "無限捲動", "name_en": "Infinite scroll", "meaning_zh": "捲到底部時自動載入更多內容", "ask_zh": "最新消息列表改成無限捲動，捲到底時顯示載入中的圖示，每次增加 10 筆。", "tags": ["infinite-scroll", "endless-scroll", "load-more", "feed", "pagination", "spinner", "list"], "pack_zh": "Landing Page 與網站效果"}, {"id": "092", "pack": "lp", "no": "20", "slug": "page-transition", "category": "loading-loops", "name_zh": "頁面轉場", "name_en": "Page transition", "meaning_zh": "換頁時的過場動畫", "ask_zh": "加上頁面轉場，點擊連結後有一片橘紅色的幕布由左往右橫掃過畫面，接著切換到下一頁。", "tags": ["page-transition", "transition", "view-transitions", "navigation", "wipe", "barba", "spa"], "pack_zh": "Landing Page 與網站效果"}, {"id": "093", "pack": "lp", "no": "21", "slug": "smooth-scroll", "category": "loading-loops", "name_zh": "平滑捲動", "name_en": "Smooth scroll", "meaning_zh": "點擊錨點連結時順暢地移動過去", "ask_zh": "選單的錨點連結改成平滑捲動，停止的位置要扣掉固定式 Header 的高度。", "tags": ["smooth-scroll", "scroll-behavior", "anchor-link", "in-page-link", "back-to-top", "navigation"], "pack_zh": "Landing Page 與網站效果"}, {"id": "094", "pack": "lp", "no": "22", "slug": "marquee", "category": "loading-loops", "name_zh": "Marquee 跑馬燈", "name_en": "Marquee", "meaning_zh": "文字或圖片在橫帶中不斷流動", "ask_zh": "服務名稱用 Marquee 跑馬燈由右往左流動，無縫循環，速度大約每秒 80 px。", "tags": ["marquee", "ticker", "infinite-loop", "scrolling-text", "logo-strip", "band", "loop"], "pack_zh": "Landing Page 與網站效果"}, {"id": "095", "pack": "lp", "no": "23", "slug": "animated-gradient", "category": "loading-loops", "name_zh": "漸層動畫", "name_en": "Animated gradient", "meaning_zh": "背景色彩的混合不斷流動變化", "ask_zh": "Hero 區塊的背景做成漸層動畫，橘紅色和藍色慢慢地混合，10 秒循環一次。", "tags": ["gradient", "animated-gradient", "mesh-gradient", "background", "hero", "ambient", "loop"], "pack_zh": "Landing Page 與網站效果"}, {"id": "096", "pack": "lp", "no": "24", "slug": "floating-animation", "category": "loading-loops", "name_zh": "漂浮動畫", "name_en": "Floating animation", "meaning_zh": "裝飾元素緩慢地上下飄浮", "ask_zh": "Hero 區塊的手機圖片加上漂浮動畫，上下 8 px，2.4 秒一個來回。", "tags": ["floating", "float", "bob", "hover-animation", "keyframes", "translatey", "decoration", "loop"], "pack_zh": "Landing Page 與網站效果"}, {"id": "097", "pack": "photo", "no": "01", "slug": "backlighting", "category": "lighting", "name_zh": "逆光", "name_en": "Backlighting", "meaning_zh": "光源在被攝者的正後方", "ask_zh": "站在草原上的人物，用逆光拍攝，把夕陽放在頭部正後方，讓髮絲的輪廓發亮，整體帶一點柔柔的霧感。", "tags": ["backlighting", "backlit", "contre-jour", "sun behind", "haze", "glow", "halo"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "098", "pack": "photo", "no": "02", "slug": "rim-light", "category": "lighting", "name_zh": "輪廓光", "name_en": "Rim light", "meaning_zh": "從後方打光，只讓輪廓發亮", "ask_zh": "黑色背景的人像，用輪廓光，從左右兩側斜後方各打一盞。臉保持暗的，只讓頭部和肩膀的輪廓亮起一圈細細的光邊。", "tags": ["rim light", "rim lighting", "edge light", "backlight", "kicker", "outline", "studio"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "099", "pack": "photo", "no": "03", "slug": "silhouette", "category": "lighting", "name_zh": "剪影", "name_en": "Silhouette", "meaning_zh": "以明亮的天空為背景，被攝者只呈現黑色的形狀", "ask_zh": "夕陽下在沙灘上跳躍的人物，拍成剪影。曝光以天空為準，讓人物和椰子樹變成全黑。", "tags": ["silhouette", "backlit", "sunset", "contre-jour", "black shape", "underexposed"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "100", "pack": "photo", "no": "04", "slug": "split-lighting", "category": "lighting", "name_zh": "分割光", "name_en": "Split lighting", "meaning_zh": "從正側面打光，把臉分成一半亮一半暗", "ask_zh": "男性的人像，用分割光。光從正側面 90° 打過來，以鼻樑為界，臉的左半邊沉入陰影。", "tags": ["split lighting", "side light", "portrait lighting", "half face", "dramatic", "chiaroscuro"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "101", "pack": "photo", "no": "05", "slug": "rembrandt-lighting", "category": "lighting", "name_zh": "林布蘭光", "name_en": "Rembrandt lighting", "meaning_zh": "從斜上方打光，在陰影側的臉頰留下一塊三角形亮光", "ask_zh": "老人的肖像，用林布蘭光。光從側前方 45°、偏高處往下打，在陰影側的臉頰上留下一小塊三角形的亮光。", "tags": ["rembrandt lighting", "portrait lighting", "triangle", "45 degree light", "chiaroscuro", "painterly"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "102", "pack": "photo", "no": "06", "slug": "butterfly-lighting", "category": "lighting", "name_zh": "蝴蝶光", "name_en": "Butterfly lighting", "meaning_zh": "從正前方偏高處打光，鼻子下方出現蝴蝶形的陰影", "ask_zh": "女性的美妝人像，用蝴蝶光。光在臉的正前方、偏上 45° 的位置，鼻子下方留下一小塊蝴蝶形狀的陰影。", "tags": ["butterfly lighting", "paramount lighting", "beauty lighting", "portrait lighting", "overhead light", "glamour"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "103", "pack": "photo", "no": "07", "slug": "golden-hour", "category": "lighting", "name_zh": "黃金時刻", "name_en": "Golden hour", "meaning_zh": "日落前、日出後那段低角度、偏暖的光線", "ask_zh": "草原上的人物，用黃金時刻的光線。太陽靠近地平線，影子拉得很長，整個畫面偏橘色。", "tags": ["golden hour", "magic hour", "sunset light", "warm light", "long shadows", "low sun"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "104", "pack": "photo", "no": "08", "slug": "blue-hour", "category": "lighting", "name_zh": "藍調時刻", "name_en": "Blue hour", "meaning_zh": "日落後、日出前天空轉為深藍色的時段", "ask_zh": "港口城市的夜景，拍藍調時刻。天空是深藍色，大樓的窗戶和路燈的暖光倒映在水面上。", "tags": ["blue hour", "twilight", "dusk", "night city", "cityscape", "deep blue sky"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "105", "pack": "photo", "no": "09", "slug": "bokeh", "category": "lens-camera", "name_zh": "散景", "name_en": "Bokeh", "meaning_zh": "對焦範圍外的點光源，化成圓形柔軟的光斑", "ask_zh": "夜晚的城市裡站著一個人，背景的路燈要變成大顆圓形的散景。光圈 f/1.4，對焦在人物身上。", "tags": ["bokeh", "shallow depth of field", "background blur", "wide aperture", "f/1.4", "out of focus", "lights"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "106", "pack": "photo", "no": "10", "slug": "tilt-shift", "category": "lens-camera", "name_zh": "移軸", "name_en": "Tilt-shift", "meaning_zh": "把上下兩側模糊，讓真實的街景看起來像模型", "ask_zh": "從高處俯瞰的城鎮，用移軸效果。只讓中間一條帶狀範圍對焦，上下強烈模糊，色彩調濃一點，做出迷你模型的感覺。", "tags": ["tilt-shift", "miniature", "miniature effect", "fake miniature", "selective focus", "toy town", "focus band"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "107", "pack": "photo", "no": "11", "slug": "long-exposure", "category": "lens-camera", "name_zh": "長曝", "name_en": "Long exposure", "meaning_zh": "快門開很久，讓移動的光變成線條", "ask_zh": "夜晚的馬路，用長曝拍攝。快門 8 秒，車子的形體消失，只剩頭燈和尾燈拉成白色與紅色的光軌。", "tags": ["long exposure", "light trails", "slow shutter", "night photography", "car trails", "motion"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "108", "pack": "photo", "no": "12", "slug": "panning-shot", "category": "lens-camera", "name_zh": "追焦", "name_en": "Panning shot", "meaning_zh": "跟著移動的被攝者拍，只讓背景拉出流動線條", "ask_zh": "行駛中的紅色汽車，用追焦拍攝：相機跟著車子水平移動，快門 1/15 秒，車子清楚銳利，背景的樹和建築往橫向拉出流動的線條。", "tags": ["panning", "panning shot", "motion blur", "speed", "sports photography", "slow shutter"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "109", "pack": "photo", "no": "13", "slug": "lens-flare", "category": "lens-camera", "name_zh": "鏡頭耀光", "name_en": "Lens flare", "meaning_zh": "強光進入鏡頭，產生光環與光斑", "ask_zh": "把山頂的太陽拍進畫面，加上鏡頭耀光。讓彩色的光斑從太陽穿過畫面中心，一路排列到另一側。", "tags": ["lens flare", "flare", "ghosting", "sun flare", "starburst", "cinematic"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "110", "pack": "photo", "no": "14", "slug": "fisheye-lens", "category": "lens-camera", "name_zh": "魚眼鏡頭", "name_en": "Fisheye lens", "meaning_zh": "中心膨脹、直線彎曲成弧形的超廣角鏡頭", "ask_zh": "街道用魚眼鏡頭拍攝，視角 180°，大樓垂直的線條向外彎成圓弧。", "tags": ["fisheye", "fisheye lens", "barrel distortion", "ultra wide", "8mm", "distortion"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "111", "pack": "photo", "no": "15", "slug": "chromatic-aberration", "category": "lens-camera", "name_zh": "色差", "name_en": "Chromatic aberration", "meaning_zh": "明暗交界處出現紅色或藍紫色的色邊", "ask_zh": "白色天空與黑色樹枝的照片，加一點色差（邊緣的紅色與藍紫色色邊）。越靠近畫面邊緣，色邊越明顯。", "tags": ["chromatic aberration", "color fringing", "rgb split", "lens aberration", "fringe", "glitch"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "112", "pack": "photo", "no": "16", "slug": "vignette", "category": "lens-camera", "name_zh": "暗角", "name_en": "Vignette", "meaning_zh": "畫面四角變暗，視線集中到中央", "ask_zh": "海邊的照片，暗角加重、做得明顯一點。只讓四個角落平順地變暗，讓視線集中到中央的人物身上。", "tags": ["vignette", "vignetting", "dark corners", "edge darkening", "lens falloff", "focus"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "113", "pack": "photo", "no": "17", "slug": "high-key", "category": "tone-finish", "name_zh": "High Key（高調）", "name_en": "High-key", "meaning_zh": "只用明亮的色調，畫面偏白、陰影很淡", "ask_zh": "白色桌上的杯子與瓶子，用 High Key 高調風格拍攝。背景純白，陰影非常淡，整體只用明亮的色調。", "tags": ["high-key", "high key", "bright", "white background", "airy", "low contrast"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "114", "pack": "photo", "no": "18", "slug": "low-key", "category": "tone-finish", "name_zh": "Low Key（低調）", "name_en": "Low-key", "meaning_zh": "以暗色調為主，只有受光處浮現出來", "ask_zh": "黑色背景上的威士忌酒瓶，用 Low Key 低調風格拍攝。僅用側邊一盞燈，讓受光的邊緣浮現出來，畫面大半沉入黑色。", "tags": ["low-key", "low key", "dark", "black background", "moody", "dramatic", "chiaroscuro"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "115", "pack": "photo", "no": "19", "slug": "black-and-white", "category": "tone-finish", "name_zh": "黑白", "name_en": "Black and white", "meaning_zh": "去掉顏色，只用明暗呈現", "ask_zh": "海邊的隨手拍，轉成黑白。對比稍微拉高一點，保留天空與沙灘之間的明暗差異。", "tags": ["black and white", "monochrome", "b&w", "grayscale", "desaturated", "classic"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "116", "pack": "photo", "no": "20", "slug": "duotone", "category": "tone-finish", "name_zh": "雙色調", "name_en": "Duotone", "meaning_zh": "只用兩種顏色表現暗部與亮部", "ask_zh": "把人像照片做成深藍與粉紅的雙色調。暗部用深藍、亮部用粉紅，只用這兩種顏色。", "tags": ["duotone", "two-tone", "gradient map", "color overlay", "poster", "graphic"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "117", "pack": "photo", "no": "21", "slug": "teal-and-orange", "category": "tone-finish", "name_zh": "Teal & Orange", "name_en": "Teal and orange", "meaning_zh": "陰影偏青綠色，膚色與亮部偏橘色的色調", "ask_zh": "在街上走路的人物，調成電影感的 Teal & Orange。陰影和天空偏青綠色，皮膚和夕陽偏橘色。", "tags": ["teal and orange", "orange and teal", "cinematic", "color grading", "blockbuster", "film look"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "118", "pack": "photo", "no": "22", "slug": "film-grain", "category": "tone-finish", "name_zh": "底片顆粒", "name_en": "Film grain", "meaning_zh": "加上像底片相機拍出來的細緻顆粒", "ask_zh": "幫海邊的照片加上底片顆粒。整體加上細緻的顆粒，黑色稍微提起並帶一點暖色。", "tags": ["film grain", "grain", "noise", "analog", "35mm film", "texture", "warm tone"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "119", "pack": "photo", "no": "23", "slug": "light-leak", "category": "tone-finish", "name_zh": "漏光", "name_en": "Light leak", "meaning_zh": "像底片被光線漏進去，出現紅橘色的暈染", "ask_zh": "夏天回憶的照片，從右側邊緣加入漏光。讓紅色和橘色的光暈滲進畫面。", "tags": ["light leak", "film leak", "vintage", "analog", "lomo", "warm glow"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "120", "pack": "photo", "no": "24", "slug": "double-exposure", "category": "tone-finish", "name_zh": "多重曝光", "name_en": "Double exposure", "meaning_zh": "把兩張照片疊在同一個畫面裡", "ask_zh": "把側臉剪影和森林山景用多重曝光疊在一起。背景是白色，風景只出現在臉的輪廓裡面。", "tags": ["double exposure", "multiple exposure", "blend", "silhouette", "surreal", "composite"], "pack_zh": "攝影風格：光線、鏡頭與調色"}, {"id": "121", "pack": "motion2", "no": "01", "slug": "anticipation", "category": "techniques", "name_zh": "預備動作", "name_en": "Anticipation", "meaning_zh": "移動前先往反方向稍微蓄力", "ask_zh": "按鈕往右飛出去之前，請加上預備動作：花 0.3 秒往反方向稍微拉回、壓扁，再衝出去。", "tags": ["anticipation", "wind-up", "squash", "character", "jump", "dash", "animation-principle"], "pack_zh": "Motion Graphics 動態手法 第 2 彈"}, {"id": "122", "pack": "motion2", "no": "02", "slug": "follow-through", "category": "techniques", "name_zh": "跟隨動作", "name_en": "Follow-through", "meaning_zh": "主體停下後，部分仍慢一拍擺動", "ask_zh": "角色停下來之後，請讓頭髮和旗子加上跟隨動作，晚約 0.5 秒擺動，然後慢慢靜止。", "tags": ["follow-through", "overlapping-action", "secondary-motion", "spring", "drag", "character", "animation-principle"], "pack_zh": "Motion Graphics 動態手法 第 2 彈"}, {"id": "123", "pack": "motion2", "no": "03", "slug": "bounce", "category": "techniques", "name_zh": "彈跳效果", "name_en": "Bounce", "meaning_zh": "落下後一路彈跳到停住", "ask_zh": "請讓球從上方落下並加上彈跳效果：彈 3 次，一次比一次低。", "tags": ["bounce", "drop", "gravity", "ball", "physics", "landing", "easing"], "pack_zh": "Motion Graphics 動態手法 第 2 彈"}, {"id": "124", "pack": "motion2", "no": "04", "slug": "wiggle", "category": "techniques", "name_zh": "Wiggle", "name_en": "Wiggle", "meaning_zh": "細微、隨機地持續抖動", "ask_zh": "請幫通 let tab = 'styles';
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200);}
async function copy(text,label){
  try{ await navigator.clipboard.writeText(text); toast('已複製：'+(label||'提示詞')); }
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();toast('已複製：'+(label||'提示詞'));
  }
}
const packTitles = [...new Set(DATA.els.map(e=>e.pack_zh))];
function fillSelect(){
  const f=$('#f'), cur=f.value;
  if(tab==='styles'){ f.innerHTML = '<option value="">全部分類</option>'; f.disabled=true; f.style.display='none'; return; }
  else{
    f.disabled=false; f.style.display='';
    f.innerHTML = '<option value="">全部 10 類</option>' + packTitles.map(p=>`<option>${esc(p)}</option>`).join('');
    if(packTitles.includes(cur)) f.value = cur;
  }
}
function render(){
  const q = $('#q').value.trim().toLowerCase();
  const fv = $('#f').value;
  const g = $('#grid');
  if(tab==='styles'){
    const list = DATA.cards.filter(c => !q || (c.name_zh+' '+c.name_en+' '+c.clause).toLowerCase().includes(q));
    $('#cnt').textContent = list.length + ' / ' + DATA.cards.length + ' 種風格';
    g.innerHTML = list.map(c=>`
      <article class="card">
        <img src="${c.img}" alt="${esc(c.name_zh)} 樣張" loading="lazy">
        <div class="body">
          <h3>${esc(c.name_zh)}</h3>
          <div class="en">${esc(c.name_en)}</div>
          <button class="copy" data-copy="${c.no}" data-label="${esc(c.name_zh)}">複製提示詞</button>
          <details><summary>看提示詞全文</summary>
            <pre id="p-${c.no}">${esc(c.prompt)}</pre>
            <button class="copy" data-copy="${c.no}" data-label="${esc(c.name_zh)}">複製提示詞</button>
          </details>
        </div>
      </article>`).join('');
  }else{
    const list = DATA.els.filter(e => (!fv || e.pack_zh===fv) &&
      (!q || (e.name_zh+' '+e.name_en+' '+e.meaning_zh+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q)));
    $('#cnt').textContent = list.length + ' / ' + DATA.els.length + ' 條詞彙';
    g.innerHTML = list.map(e=>`
      <article class="card"><div class="body">
        <h3>${esc(e.name_zh)}</h3>
        <div class="en">${esc(e.name_en)} · ${esc(e.pack_zh)} · #${e.id}</div>
        <p>${esc(e.meaning_zh)}</p>
        <div>${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        <button class="copy" data-copy="m-${e.id}" data-label="${esc(e.name_zh)}">複製指令</button>
        <details><summary>看指令全文</summary>
          <pre id="m-${e.id}">${esc(e.ask_zh)}</pre>
          <button class="copy" data-copy="m-${e.id}" data-label="${esc(e.name_zh)}">複製指令</button>
        </details>
      </div></article>`).join('');
  }
  g.querySelectorAll('button.copy').forEach(b=>{
    b.onclick = () => {
      const key = b.dataset.copy;
      const src = key.startsWith('m-') ? DATA.els.find(x=>x.id===key.slice(2))?.ask_zh
                                       : DATA.cards.find(x=>x.no===key)?.prompt;
      copy(src || '', b.dataset.label);
    };
  });
}
$('#q').addEventListener('input', render);
$('#f').addEventListener('change', render);
$('#tab-styles').onclick = () => { tab='styles'; $('#tab-styles').setAttribute('aria-selected','true');
  $('#tab-motion').setAttribute('aria-selected','false'); fillSelect(); render(); };
$('#tab-motion').onclick = () => { tab='motion'; $('#tab-motion').setAttribute('aria-selected','true');
  $('#tab-styles').setAttribute('aria-selected','false'); fillSelect(); render(); };
fillSelect(); render();
</script>
</body>
</html>
